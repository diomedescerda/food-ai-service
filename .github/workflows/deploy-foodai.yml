name: Deploy FoodAI Service

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-foodai-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 933629770820.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: cooppadresd-foodai
  ECS_CLUSTER: cooppadresd-cluster
  ECS_SERVICE: cooppadresd-foodai

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de test
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Tests (pytest)
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::933629770820:role/cooppadresd-gha-foodai
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build imagen (${{ github.sha }})
        timeout-minutes: 45
        run: |
          docker build \
            -t "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" \
            -t "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest" \
            .

      - name: Push ECR
        run: |
          docker push "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker push "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest"

      - name: Registrar nueva Task Definition (imagen SHA)
        id: taskdef
        shell: bash
        run: |
          TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition "${{ env.ECS_SERVICE }}" --region "${{ env.AWS_REGION }}" --query "taskDefinition" --output json)
          NEW_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          # Motor LLM-visión (change foodai-motor-llm-vision): proveedor activo y modelos.
          # El circuit breaker ya vive en la app (3 fallos / 300 s, defaults del Settings).
          # Rollback sin redeploy: cambiar FOOD_AI_PROVIDER=legacy en la task def.
          EXTRA_ENV='[{"name":"FOOD_AI_PROVIDER","value":"llm"},{"name":"FOOD_AI_LLM_PROVIDER","value":"anthropic"},{"name":"FOOD_AI_LLM_MODEL","value":"claude-haiku-4-5-20251001"},{"name":"FOOD_AI_LLM_MODEL_OPENAI","value":"gpt-4o-mini"}]'
          # Las keys reutilizan el secret de ai-service (mismas credenciales del proveedor);
          # el rol de ejecución ya las lee para cooppadresd-ai en este mismo patrón.
          EXTRA_SECRETS='[{"name":"FOOD_AI_LLM_API_KEY","valueFrom":"arn:aws:secretsmanager:us-east-2:933629770820:secret:cooppadresd/ai-i55L3X:ANTHROPIC_API_KEY::"},{"name":"FOOD_AI_LLM_API_KEY_OPENAI","valueFrom":"arn:aws:secretsmanager:us-east-2:933629770820:secret:cooppadresd/ai-i55L3X:OPENAI_API_KEY::"}]'
          # Merge declarativo (patrón de deploy-backend.yml): preserva env/secrets previos,
          # reemplaza por nombre y evita choque env vs secret. Sin comments dentro del jq.
          NEW_TASK_DEF_JSON=$(echo "$TASK_DEF_JSON" | jq --arg img "$NEW_IMAGE" --argjson envs "$EXTRA_ENV" --argjson secs "$EXTRA_SECRETS" '
            .containerDefinitions[0].image = $img |
            del(.status, .compatibilities, .taskDefinitionArn, .revision, .registeredAt, .registeredBy, .requiresAttributes) |
            .containerDefinitions[0].environment =
              ((.containerDefinitions[0].environment // []) as $cur |
               (.containerDefinitions[0].secrets // []) as $cursec |
               [$cur[] | select(. as $e | ([$envs[].name] | index($e.name)) | not)] +
               [$envs[] | select(. as $e | ([$cursec[].name] | index($e.name)) | not)]) |
            .containerDefinitions[0].secrets =
              ((.containerDefinitions[0].secrets // []) as $cur |
               [$cur[] | select(. as $e | ([$secs[].name] | index($e.name)) | not)] + $secs)
          ')
          echo "envs finales: $(echo "$NEW_TASK_DEF_JSON" | jq -r '[.containerDefinitions[0].environment[]?.name] | join(",")')"
          echo "secrets finales: $(echo "$NEW_TASK_DEF_JSON" | jq -r '[.containerDefinitions[0].secrets[]?.name] | join(",")')"
          REGISTERED=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF_JSON" --region "${{ env.AWS_REGION }}")
          echo "arn=$(echo "$REGISTERED" | jq -r '.taskDefinition.taskDefinitionArn')" >> "$GITHUB_OUTPUT"

      - name: Actualizar ECS Service
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Esperar rollout COMPLETED (polling 15s)
        timeout-minutes: 30
        shell: bash
        run: |
          SERVICE="${{ env.ECS_SERVICE }}"
          TD_ARN="${{ steps.taskdef.outputs.arn }}"
          DEADLINE=$((SECONDS + 1800))

          while true; do
            DEP=$(aws ecs describe-services \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --services "$SERVICE" \
              --region "${{ env.AWS_REGION }}" \
              --query "services[0].deployments[?taskDefinition=='$TD_ARN'] | [0]" \
              --output json)

            STATE=$(echo "$DEP" | jq -r '.rolloutState // "MISSING"')
            RUNNING=$(echo "$DEP" | jq -r '.runningCount // "?"')
            DESIRED=$(echo "$DEP" | jq -r '.desiredCount // "?"')

            echo "[$(date -u +%H:%M:%S)] rollout=$STATE running=$RUNNING desired=$DESIRED"

            if [ "$STATE" = "COMPLETED" ] && [ "$RUNNING" = "$DESIRED" ]; then
              echo "Deployment estable: rollout=$STATE running=$RUNNING desired=$DESIRED"
              exit 0
            fi

            if [ "$STATE" = "FAILED" ]; then
              echo "::error::Rollout FAILED: el deployment de $SERVICE no pudo completarse"
              exit 1
            fi

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Timeout 30 min: rollout=$STATE running=$RUNNING desired=$DESIRED"
              exit 1
            fi

            sleep 15
          done

      - name: Diagnóstico en fallo
        if: failure()
        shell: bash
        run: |
          TASKS=$(aws ecs list-tasks \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service-name "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}" --query "taskArns" --output text)
          for T in $TASKS; do
            aws ecs describe-tasks \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --tasks "$T" --region "${{ env.AWS_REGION }}" \
              --query "tasks[0].{Status:lastStatus,Stop:stoppedReason,Containers:containers[*].{Name:name,Exit:exitCode,Reason:reason}}" \
              --output json
          done
